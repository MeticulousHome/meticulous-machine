name: Upload bundle to hawkbit

on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  upload-bundle:
    # needs: build-bundle
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests attrs requests-toolbelt

    - name: Get latest debian workflow run ID
      id: get_run_id
      run: |
        latest_run_id=$(curl -s \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-nightly-image.yml/runs?status=success&per_page=1" \
          | jq -r '.workflow_runs[0].id')
        echo "latest_run_id=${latest_run_id}" >> $GITHUB_ENV

    - name: Download sdcard bundle
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ env.latest_run_id }}
        name: sdcard-bundle
        github-token: ${{ secrets.GH_TOKEN }}
        path: .

    - name: Download emmc bundle
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ env.latest_run_id }}
        name: emmc-bundle
        github-token: ${{ secrets.GH_TOKEN }}
        path: .

    - name: Read bundle version
      run: |
        bundles=( *_emmc_*.raucb )
        if [[ ${#bundles[@]} -ne 1 || ! -f "${bundles[0]}" ]]; then
          echo "::error::Expected exactly one EMMC bundle"
          exit 1
        fi
        bundle_version="${bundles[0]#*_emmc_nightly_}"
        bundle_version="${bundle_version%.raucb}"
        if [[ ! "$bundle_version" =~ ^[0-9]{4}M[0-9]+-nightly$ ]]; then
          echo "::error::Unexpected nightly bundle version: $bundle_version"
          exit 1
        fi
        echo "BUNDLE_VERSION=$bundle_version" >> "$GITHUB_ENV"
    
    - name: Upload sdcard bundle
      run: |
        python misc/hawkbit-upload.py \
          "${{ secrets.HAWKBIT_SERVER }}" \
          "${{ secrets.HAWKBIT_PORT }}" \
          *_sdcard_*.raucb \
          ${{ secrets.HAWKBIT_USER }} \
          ${{ secrets.HAWKBIT_PASSWORD }} \
          "Nightly SDCard" \
          "Rootfs SDCard" \
          "$BUNDLE_VERSION" \
          "nightly" \
          "sdcard"

    - name: Upload emmc bundle
      run: |
        python misc/hawkbit-upload.py \
          "${{ secrets.HAWKBIT_SERVER }}" \
          "${{ secrets.HAWKBIT_PORT }}" \
          *_emmc_*.raucb \
          ${{ secrets.HAWKBIT_USER }} \
          ${{ secrets.HAWKBIT_PASSWORD }} \
          "Nightly EMMC" \
          "Rootfs EMMC" \
          "$BUNDLE_VERSION" \
          "nightly" \
          "emmc"
