name: Configure Hawkbit polling

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pollingTime=01:00:00 (otherwise dry-run only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure-polling:
    runs-on: ubuntu-24.04
    env:
      HAWKBIT_SERVER: ${{ secrets.HAWKBIT_SERVER }}
      HAWKBIT_PORT: ${{ secrets.HAWKBIT_PORT }}
      HAWKBIT_USER: ${{ secrets.HAWKBIT_USER }}
      HAWKBIT_PASSWORD: ${{ secrets.HAWKBIT_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests attrs requests-toolbelt

      - name: Configure hourly polling
        shell: bash
        run: |
          apply_argument=()
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            apply_argument=(--apply)
          fi
          python misc/configure-hawkbit-polling.py "${apply_argument[@]}"
