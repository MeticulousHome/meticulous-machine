name: Validate standby sleep hook

on:
  pull_request:
    paths:
      - ".github/workflows/validate-standby-sleep-hook.yml"
      - "config/usr/lib/systemd/system-sleep/meticulous-standby"
      - "config/usr/lib/firmware/nxp/var_wifi_mod_para.conf"
      - "scripts/met-iw612-set-region"
      - "tests/test_standby_sleep_hook.py"
  push:
    branches:
      - beta
      - nightly
    paths:
      - ".github/workflows/validate-standby-sleep-hook.yml"
      - "config/usr/lib/systemd/system-sleep/meticulous-standby"
      - "config/usr/lib/firmware/nxp/var_wifi_mod_para.conf"
      - "scripts/met-iw612-set-region"
      - "tests/test_standby_sleep_hook.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout meticulous-machine
        uses: actions/checkout@v4

      - name: Run standby sleep hook tests
        run: python -m unittest -v tests/test_standby_sleep_hook.py
