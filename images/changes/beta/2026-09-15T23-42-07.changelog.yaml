      - hash: "deb894b"
        message: "The tarball freezes whatever base-files trixie served on the day it was built (base-files is pinned to trixie for libc, and it rewrites os-release). Every Debian point release ships a new base-files, so a tarball cached across a point release gets its os-release clobbered by the next dist-upgrade. Key on the archive version so each point release forces a tarball rebuild that resyncs base-files."
